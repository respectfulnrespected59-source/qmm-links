<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C.U.I. F.A.C.T.S. — Food · Art · Clothes · Tech · Shelter</title>
<meta name="description" content="Walk the block. Stock the reserve. Hold the line when the grid goes down. The 3D world of the Common Unity Initiative.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0714'/%3E%3Cpath d='M16 6 L28 16 L16 26 L4 16 Z' fill='%234A3428'/%3E%3Cpath d='M16 6 L28 16 L16 20 L4 16 Z' fill='%23E3B23C' opacity='.9'/%3E%3Ccircle cx='16' cy='15' r='3.2' fill='%23E8843C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ONE family now, not two. Bangers is gone: the display voice is Georgia, a
     local serif, read off quantummelaninmedia.com's own computed h1. Rakkas
     stays for the C.U.I. brand glyphs only — it is the Moorish mark, and it is
     the one place a decorative face earns its request. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&display=swap">
<style>
/* C.U.I. F.A.C.T.S. — 3D world shell.
   Same Afro-futurist earth direction as the 2D game: deep indigo ground,
   terracotta and copper structure, gold as the signal colour. The HUD sits
   ON the world, not in a chrome bar around it — this is a place, not an app. */
:root {
  /* THE QMM HOUSE PALETTE — quantummelaninmedia.com, the same tokens QUAN-TESS
     runs on: gold, deep indigo, violet. Owner, 2026-09-18: "that new super
     smooth QMM web page GOLD and dark blue and purple like how the QMM site
     looks and how we did QUAN-TESS".

     ONLY THE CHROME MOVES. The WORLD's colours live in src/config.js PAL,
     which is shared with the 2D game and with every art registry — recolouring
     there would repaint both renderers and every building. The HUD, the sheets
     and the panels are this file's to set, and they are what you actually read
     the game through. */
  --ink:#07050d; --ink-2:#0d0918;
  --card:#160f24; --card-hi:#1e1533; --line:#2c2140;
  --gold:#e8c25a; --gold-hi:#f5dc8e; --violet:#a877e6; --sky:#6fb7ff;
  --ember:#E8843C; --copper:#B5651D; --terracotta:#A44A3F;
  --bone:#f3efe6; --mut:#a99fc0;
  --unity:#f5dc8e;
  --edge: 0 0 0 1px rgba(232,194,90,.24), 0 8px 28px rgba(0,0,0,.55);
  /* One easing for everything that moves, so the whole UI has one gait. */
  --ease: .16s cubic-bezier(.22,.61,.36,1);

  /* ── TYPE, READ OFF THE SITE RATHER THAN GUESSED ──────────────────────
     Owner, 2026-09-18: "get this visually updated to the website quality".
     So I opened quantummelaninmedia.com and QUAN-TESS headless and read their
     computed styles instead of building what I imagined they looked like:

       h1        Georgia, 72px, weight 400, letter-spacing -0.72px
       body      -apple-system / Segoe UI, NOT a serif
       colours   bg #07050d · text #f3efe6 · muted #a99fc0 · gold #e8c25a

     That is an elegant SERIF display over a clean sans body. The game was
     running Bangers — an Impact-class poster face — for all 38 of its display
     strings, and that single choice was most of why it did not look like the
     site. Both hero titles are also TWO-TONE (gold word + bone word), which
     .brand h1 now does.

     Georgia and the system sans are local, so this costs no webfont request:
     the page now loads ONE family (Rakkas, for the C.U.I. brand glyphs) where
     it used to load two. */
  --display: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:var(--ink); }
/* Body copy is SANS on both of his sites. Rakkas at paragraph size was the
   other half of the problem: a decorative display face set as body text reads
   as a fantasy game, not as a product. Rakkas survives on the brand mark. */
body { font-family:var(--sans); color:var(--bone); -webkit-font-smoothing:antialiased;
       font-size:15px; line-height:1.55; }
#scene { display:block; width:100vw; height:100vh; touch-action:none; cursor:grab; }
#scene:active { cursor:grabbing; }

#hud { position:fixed; inset:0; pointer-events:none; padding:18px; display:flex;
       flex-direction:column; justify-content:space-between; }
.row { display:flex; gap:14px; align-items:flex-start; justify-content:space-between; }

/* The title block. A kente-derived rule under it rather than a border-box —
   a straight line would read as a web page; the notched rule reads as cloth.
   The lockup itself is now the site's: a serif at weight 400 with TIGHT
   (negative) tracking, and two-tone — gold word, bone word — exactly as
   "Quantum Melanin Media" and "QUAN-TESS The Akashic AI" are set.
   The hard letterpress shadow is gone; the site has no such thing. */
.brand h1 { font-family:var(--display); font-size:clamp(21px,2.5vw,36px);
            margin:0; letter-spacing:-.01em; font-weight:400; color:var(--bone);
            text-shadow:0 2px 24px rgba(0,0,0,.6); }
.brand h1 .lead { color:var(--gold); }
.brand .facts { display:flex; gap:.42em; font-size:clamp(9px,.86vw,12px); letter-spacing:.30em;
                margin-top:5px; color:#C6B79A; text-transform:uppercase; }
.brand .facts b { color:var(--ember); font-weight:400; }
.kente { height:5px; width:230px; margin-top:8px;
  background:
    repeating-linear-gradient(90deg, var(--gold) 0 13px, transparent 13px 21px),
    repeating-linear-gradient(90deg, var(--terracotta) 0 7px, var(--copper) 7px 15px);
  opacity:.85; }

/* Indigo-violet glass instead of flat navy. The clipped corner STAYS — it is
   the Moorish x graphic-novel signature the owner asked for in August, and
   "smooth" was a note about colour and finish, not an instruction to turn this
   into a rounded web card. The smoothness comes from the blur, the softer
   shadow and one shared easing. */
.panel { background:linear-gradient(160deg, rgba(30,21,51,.90), rgba(13,9,24,.95));
         box-shadow:var(--edge); padding:9px 13px; display:flex; gap:15px; align-items:center;
         backdrop-filter:blur(7px);
         border-radius:12px; }
/* The stat row. Numerals are the SERIF at a real size; labels are tiny, upper,
   wide-tracked and muted — the site's exact hierarchy. Separated by hairlines
   rather than by gaps, which is what makes it read as one instrument. */
.panel.stats { gap:0; padding:10px 6px; align-items:stretch; }
.stat { display:flex; flex-direction:column; align-items:flex-start; gap:1px;
        padding:2px 16px; border-left:1px solid var(--line); }
.stat:first-child { border-left:0; }
.stat b { font-family:var(--display); font-weight:400; font-size:23px;
          line-height:1; letter-spacing:-.01em; color:var(--gold); }
.stat i { font-style:normal; font-family:var(--sans); font-size:9.5px;
          letter-spacing:.18em; text-transform:uppercase; color:var(--mut); }
/* Ready is the one number that is a WARNING as much as a fact, so it keeps
   the ember; the clock is ambient and stays muted. */
#hud-ready { color:var(--ember); }
#hud-clock { color:var(--mut); font-size:19px; }

/* the switch back to the Classic 2D block — the HUD is pointer-events:none, so opt in */
.switch2d { pointer-events:auto; display:inline-block; margin-top:8px; font-family:var(--display);
  font-size:12px; letter-spacing:.14em; color:var(--gold); text-decoration:none;
  border:1px solid rgba(227,178,60,.45); padding:3px 9px; border-radius:3px; background:rgba(10,7,20,.55); }
.switch2d:hover { background:rgba(227,178,60,.18); border-color:var(--gold); }
#hud-pillars { display:flex; gap:8px; }
.chip { display:flex; align-items:center; gap:5px; padding:6px 10px 6px 8px;
        background:linear-gradient(160deg, rgba(30,21,51,.92), rgba(13,9,24,.96));
        box-shadow:0 0 0 1px color-mix(in srgb, var(--c) 42%, transparent), 0 5px 18px rgba(0,0,0,.5);
        backdrop-filter:blur(7px); transition:transform var(--ease), box-shadow var(--ease);
        border-radius:10px; }
.chip .ic { font-size:14px; filter:saturate(1.15); }
.chip b { font-family:var(--display); font-size:12px; color:var(--c);
          letter-spacing:.07em; }
.chip i { font-style:normal; font-size:14px; min-width:22px; text-align:right; color:var(--bone); }

#hud-crisis { align-self:center; font-family:var(--display); font-size:22px;
              letter-spacing:.07em; color:#FFD9C4; padding:9px 24px; opacity:0;
              transform:translateY(-8px); transition:opacity .35s, transform .35s;
              background:linear-gradient(160deg, rgba(164,74,63,.94), rgba(90,24,30,.95));
              box-shadow:0 0 0 1px rgba(232,132,60,.5), 0 10px 34px rgba(0,0,0,.6);
              border-radius:14px; }
#hud-crisis.on { opacity:1; transform:translateY(0); }

.keys { display:flex; flex-wrap:wrap; gap:16px; font-size:12px; color:var(--mut);
        letter-spacing:.12em; text-transform:uppercase; }
.keys kbd { font-family:var(--display); font-size:12px; color:var(--gold);
            letter-spacing:.06em; }
/* A new verb has to be findable, or it shipped without being wired. Violet
   marks it as new against a rail of gold; it is the only one in that colour. */
.keys .key-new { color:var(--violet); }
.keys .key-new kbd { color:var(--violet); text-shadow:0 0 12px rgba(168,119,230,.55); }

/* ── The E prompt ─────────────────────────────────────────────────────── */
.prompt { position:fixed; left:50%; bottom:23%; transform:translate(-50%,8px);
          display:flex; gap:9px; align-items:center; opacity:0; pointer-events:none;
          transition:opacity .18s, transform .18s;
          background:linear-gradient(160deg, rgba(30,21,51,.94), rgba(13,9,24,.97));
          box-shadow:var(--edge); padding:8px 16px; backdrop-filter:blur(7px);
          border-radius:11px; }
.prompt.on { opacity:1; transform:translate(-50%,0); }
.prompt kbd { font-family:var(--display); font-size:15px; color:var(--ink);
              background:var(--gold); padding:2px 9px; letter-spacing:.05em; }
.prompt-label { font-size:13px; letter-spacing:.15em; color:var(--bone); }

/* ── Ghost placement hint ─────────────────────────────────────────────── */
.ghost-hint { position:fixed; left:50%; bottom:16%; transform:translateX(-50%);
              font-size:12px; letter-spacing:.16em; color:#5FE08A; opacity:0;
              transition:opacity .18s; text-shadow:0 2px 10px rgba(0,0,0,.9);
              pointer-events:none; text-align:center; max-width:70vw; }
.ghost-hint.on { opacity:1; }
.ghost-hint.bad { color:#E88A8A; }

/* ── Sheets ───────────────────────────────────────────────────────────── */
.overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
           flex-direction:column; gap:14px; background:rgba(6,4,12,.72);
           backdrop-filter:blur(3px); pointer-events:auto; padding:24px; }
.overlay.on { display:flex; }
.sheet { max-width:620px; width:100%; max-height:70vh; overflow-y:auto;
         background:linear-gradient(160deg, rgba(30,21,51,.98), rgba(13,9,24,.99));
         box-shadow:0 0 0 1px rgba(232,194,90,.2), 0 18px 54px rgba(0,0,0,.6);
         padding:26px 30px;
         border-radius:14px; }
.sheet h2 { font-family:var(--display); font-size:27px; margin:0 0 4px;
            color:var(--gold); letter-spacing:.05em; }
.sheet h2 + .sheet-body { border-top:2px solid rgba(227,178,60,.28); padding-top:14px; }
.sheet-body { display:flex; flex-direction:column; gap:11px; font-size:15px; line-height:1.55; }
.sheet.who .sheet-body { gap:9px; }
.sheet.who .ask-line { font-size:15px; }
.line b { color:var(--ember); font-weight:400; letter-spacing:.08em; font-size:12px; }
.line.warn b { color:#FF9A7A; }
.line.power span { color:var(--gold); }
.real { border-left:3px solid var(--gold); padding:9px 0 9px 14px; background:rgba(227,178,60,.07); }
.real b { color:var(--gold); letter-spacing:.1em; font-size:12px; }
.sheet-close { font-family:var(--display); font-size:14px; letter-spacing:.1em;
               background:var(--gold); color:var(--ink); border:0; padding:9px 26px;
               cursor:pointer; }
.sheet-close:hover { background:var(--ember); }

/* ── Build drawer ─────────────────────────────────────────────────────── */
.drawer { position:fixed; right:0; top:0; bottom:0; width:min(400px,86vw);
          background:linear-gradient(200deg, rgba(19,22,52,.97), rgba(10,7,20,.99));
          box-shadow:-14px 0 46px rgba(0,0,0,.6); transform:translateX(104%);
          transition:transform .3s cubic-bezier(.16,1,.3,1); pointer-events:auto;
          display:flex; flex-direction:column; padding:18px 16px; gap:12px; }
.drawer.on { transform:translateX(0); }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
.tab { display:flex; align-items:center; gap:5px; background:rgba(10,7,20,.7); border:0;
       box-shadow:0 0 0 1px color-mix(in srgb, var(--c) 34%, transparent);
       padding:6px 9px; cursor:pointer; color:var(--bone); }
.tab b { font-family:var(--display); font-size:11px; letter-spacing:.07em;
         color:var(--c); font-weight:400; }
.tab.on { background:color-mix(in srgb, var(--c) 24%, transparent);
          box-shadow:0 0 0 1px var(--c); }
.cards { display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; }
.card { display:grid; grid-template-columns:1fr auto; gap:2px 10px; text-align:left;
        background:rgba(10,7,20,.66); border:0; box-shadow:0 0 0 1px rgba(227,178,60,.16);
        padding:11px 13px; cursor:pointer; color:var(--bone); font-family:inherit; }
.card:hover { box-shadow:0 0 0 1px rgba(227,178,60,.5); background:rgba(24,18,42,.8); }
.card.sel { box-shadow:0 0 0 2px var(--gold); background:rgba(227,178,60,.12); }
.card.poor { opacity:.45; }
.card-name { font-size:15px; }
.card-cost { font-family:var(--display); font-size:14px; color:var(--unity);
             letter-spacing:.04em; }
.card-desc { grid-column:1 / -1; font-size:12px; color:#9E93B8; line-height:1.45; }
.drawer-hint { font-size:11px; letter-spacing:.13em; color:#8C82A6; text-transform:uppercase; }

/* ── DRONE VIEW — the feed overlay ────────────────────────────────────────
   Corner brackets, a reticle and two readout lines. Deliberately sparse: it
   frames the SHOT, and anything more would be a HUD competing with the thing
   you climbed into the sky to look at. Teal is the watch's own colour, the
   same one on the drones' rim lights. */
.feed { position:fixed; inset:0; pointer-events:none; opacity:0;
        transition:opacity .25s; font-family:var(--display); }
.feed.on { opacity:1; }
.feed-c { position:absolute; width:34px; height:34px; border:2px solid rgba(63,200,200,.85); }
.feed-c.tl { top:22px; left:22px; border-right:0; border-bottom:0; }
.feed-c.tr { top:22px; right:22px; border-left:0; border-bottom:0; }
.feed-c.bl { bottom:22px; left:22px; border-right:0; border-top:0; }
.feed-c.br { bottom:22px; right:22px; border-left:0; border-top:0; }
.feed-top, .feed-bot { position:absolute; left:50%; transform:translateX(-50%);
        font-size:14px; letter-spacing:.14em; color:#9FE8E8;
        text-shadow:0 2px 10px rgba(0,0,0,.85); white-space:nowrap; }
.feed-top { top:26px; }
.feed-bot { bottom:26px; color:#7FD4D4; font-size:12px; }
/* The reticle: a hairline cross, not a gunsight. This drone watches. */
.feed-ret { position:absolute; left:50%; top:50%; width:44px; height:44px;
        transform:translate(-50%,-50%); }
.feed-ret::before, .feed-ret::after { content:''; position:absolute;
        background:rgba(63,200,200,.55); }
.feed-ret::before { left:50%; top:0; width:1px; height:100%; }
.feed-ret::after { top:50%; left:0; height:1px; width:100%; }

/* ── THE THUMBS — on-screen controls, touch devices only ─────────────────
   Sized for a thumb, not a cursor: the stick and the ACT button are the two
   things reached constantly, so they sit at the bottom corners where a thumb
   already rests. Everything is translucent — this HUD sits on a world worth
   looking at, and an opaque gamepad would take a third of a phone screen
   away from it. */
.touch { position:fixed; inset:0; pointer-events:none; opacity:0; }
.touch.on { opacity:1; }
.tstick { position:absolute; left:22px; bottom:26px; width:128px; height:128px;
          border-radius:50%; pointer-events:auto; touch-action:none;
          background:radial-gradient(circle, rgba(19,22,52,.5), rgba(10,7,20,.34));
          box-shadow:0 0 0 2px rgba(227,178,60,.34), inset 0 0 26px rgba(0,0,0,.45); }
.tstick.live { box-shadow:0 0 0 2px var(--gold), inset 0 0 26px rgba(0,0,0,.5); }
.tknob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
         border-radius:50%; background:linear-gradient(160deg, rgba(227,178,60,.92), rgba(181,101,29,.92));
         box-shadow:0 4px 16px rgba(0,0,0,.55); transition:transform .08s linear; }
.tstick.live .tknob { transition:none; }

.tpad { position:absolute; right:20px; bottom:24px; width:172px; height:172px;
        pointer-events:none; }
.tbtn { position:absolute; border:0; pointer-events:auto; touch-action:none; cursor:pointer;
        font-family:var(--display); letter-spacing:.05em;
        color:var(--bone); background:linear-gradient(160deg, rgba(19,22,52,.86), rgba(10,7,20,.9));
        box-shadow:0 0 0 2px rgba(227,178,60,.34), 0 4px 16px rgba(0,0,0,.5);
        border-radius:50%; display:grid; place-items:center; }
.tbtn.live { background:rgba(227,178,60,.28); box-shadow:0 0 0 2px var(--gold); }
/* ACT is twice the size of the rest because it is pressed ten times as often. */
.tbtn.tact { right:0; bottom:0; width:82px; height:82px; font-size:30px; color:var(--gold); }
.tbtn.tsm { width:50px; height:50px; font-size:19px; }
/* Positioned by CLASS, never by nth-of-type: the flight buttons are siblings
   in the same pad, so an index-based rule silently retargets the moment the
   button order changes — the same trap that shifted every row of the
   character creator when LIKENESS landed in front of it. */
.tbtn.t-b { right:90px; bottom:2px; }
.tbtn.t-f { right:90px; bottom:58px; }
.tbtn.t-t { right:90px; bottom:114px; }
.tbtn.t-r { right:36px; bottom:96px; }
/* In the air, the flight buttons take the BUILD and RAISE slots rather than
   crowding in beside them — on a phone there is no spare thumb-width. */
.tbtn.tfly { display:none; }
.tbtn.t-up { right:90px; bottom:2px; }
.tbtn.t-dn { right:90px; bottom:58px; }
/* The lamp takes the slot T uses on the ground — free the moment you fly. */
.tbtn.t-lamp { right:90px; bottom:114px; }
.touch.flying .tbtn.tfly { display:grid; }
.touch.flying .tbtn.tsm:not(.tfly) { display:none; }

/* ── MAKING ROOM FOR THE THUMBS ──────────────────────────────────────────
   On a phone the bottom third of the screen belongs to the stick and the
   buttons. Everything the player READS has to move above that band, or the
   HUD is legible only in the gaps between their own hands. Measured on an
   iPhone 13: the stick landed on the DAY panel and the pad covered both the
   E prompt and the quest card. */
.touch-ui #hud { padding-bottom:186px; }
/* The quest card goes back to the TOP on a phone. The short-viewport rule
   below parks it at the bottom, which is exactly where the stick now is. */
.touch-ui .tutor { top:120px !important; bottom:auto !important;
                   width:min(280px,66vw); padding:10px 12px 8px; }
.touch-ui .tutor-hint { font-size:12px; }
/* Prompts sit above the pad, not behind it. */
.touch-ui .prompt { bottom:40%; }
.touch-ui .ghost-hint { bottom:33%; }
.touch-ui .jobstrip { bottom:auto; top:76px; left:auto; right:18px; min-width:0; max-width:52vw; }
/* Five chips at full size wrap into a column down the whole right edge and
   swallow the view. Smaller, and they sit in two tidy rows. */
.touch-ui #hud-pillars { gap:5px; max-width:62vw; }
.touch-ui .chip { padding:4px 7px 4px 5px; gap:3px; }
.touch-ui .chip .ic { font-size:11px; }
.touch-ui .chip b { font-size:10px; }
.touch-ui .chip i { font-size:12px; min-width:16px; }
.touch-ui .brand h1 { font-size:22px; }
.touch-ui .kente { width:150px; }
/* The drawer is a full-height panel on a phone; its cards need to clear the
   thumbs too, or the bottom one cannot be tapped. */
.touch-ui .drawer { padding-bottom:150px; }

/* ── The ask, and the buttons that answer it ──────────────────────────── */
.sheet.ask { box-shadow:0 0 0 2px var(--gold), 0 14px 46px rgba(0,0,0,.7); }
.ask-line { font-size:19px; line-height:1.5; color:#FFE9BC; padding:6px 0 4px;
            border-left:3px solid var(--ember); padding-left:14px; }
.ask-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
.act { font-family:var(--display); font-size:14px; letter-spacing:.09em;
       background:rgba(10,7,20,.7); color:var(--bone); border:0; padding:11px 22px;
       cursor:pointer; box-shadow:0 0 0 1px rgba(227,178,60,.4); margin-top:8px; }
.act:hover:not(:disabled) { box-shadow:0 0 0 1px var(--gold); background:rgba(30,22,52,.85); }
.act.go { background:var(--gold); color:var(--ink); }
.act.go:hover:not(:disabled) { background:var(--ember); }
.act:disabled { opacity:.4; cursor:not-allowed; }
.line.warn2 span { color:#E8A08A; }
.party { border-top:1px solid rgba(227,178,60,.22); padding-top:12px; margin-top:4px; }

/* ── Job / ask strip ──────────────────────────────────────────────────── */
.jobstrip { position:fixed; left:18px; bottom:74px; min-width:280px; padding:8px 14px;
            background:linear-gradient(160deg, rgba(16,19,46,.93), rgba(10,7,20,.96));
            box-shadow:var(--edge); opacity:0; transition:opacity .25s;
            font-size:12px; letter-spacing:.12em; color:var(--bone);
            border-radius:11px; }
.jobstrip.on { opacity:1; }
.jobstrip i { display:block; height:3px; margin-top:7px; background:var(--gold);
              width:0%; transition:width .4s; }

/* ── Doors panel ──────────────────────────────────────────────────────── */
.door-group { margin-top:7px; padding-top:7px; border-top:1px solid rgba(232,194,90,.22);
              display:flex; flex-direction:column; gap:1px; }
.door-group b { font-family:var(--display); font-size:14px; color:var(--gold);
                letter-spacing:.08em; font-weight:400; }
.door-credit { font-size:12px; color:#9E93B8; }
/* Tighter than it was. The list went from six doors to EIGHT when QUAN-TESS
   and Alignment 365 were added, and at the owner's 1036x476 the sheet showed
   two and a half of them — putting his own two products permanently below the
   fold, which is the opposite of why they were added. Same information, less
   air: ~44px a row instead of ~62px. */
.door { display:flex; justify-content:space-between; align-items:center; gap:12px;
        width:100%; text-align:left; background:rgba(13,9,24,.62); border:0; cursor:pointer;
        color:var(--bone); font-family:inherit; padding:7px 13px; margin-top:4px;
        border-radius:7px; box-shadow:0 0 0 1px rgba(232,194,90,.2);
        transition:background var(--ease), box-shadow var(--ease); }
.door:hover { box-shadow:0 0 0 1px var(--gold); background:var(--card-hi); }
.door-label { font-size:15px; }
.door-note { font-size:11px; letter-spacing:.1em; color:#9E93B8; text-transform:uppercase;
             white-space:nowrap; }
.door.done { opacity:.62; }
.door.done .door-note { color:var(--gold); }
.stay { margin-top:12px; padding-top:10px; border-top:1px solid rgba(227,178,60,.22); }
.stay b { color:var(--gold); }

/* Coins sit beside Unity but never look like it — different glyph, cooler
   metal. They are a record of showing up, not the block's labour. */
.coin { color:#BFD8E8 !important; }

/* ── WHO ARE YOU ───────────────────────────────────────────────────────
   The sheet sits to one side rather than dead centre, because the figure
   behind it is reskinning live and a centred modal would stand on top of the
   one thing the player is trying to look at. */
/* Narrow and pushed left so the figure it is describing stays clear of it —
   at 560px the sheet's right edge landed on the walker's shoulder. Taller than
   a normal sheet because four rows plus thirteen trades do not fit in 70vh,
   and a MOVE IN button you have to scroll to find reads as a dead end. */
/* A flex column with ONLY the body scrolling, so MOVE IN is pinned to the
   sheet and stays reachable at any window height. `min-height:0` is what
   actually lets the body shrink — a flex child defaults to min-height:auto and
   refuses to be smaller than its content, which silently defeats the overflow. */
.sheet.who { max-width:500px; margin-right:auto; margin-left:4vw; max-height:86vh;
             display:flex; flex-direction:column; overflow:hidden; padding-bottom:18px; }
.sheet.who .sheet-body { overflow-y:auto; min-height:0; flex:1; padding-right:6px; }
.sheet.who > .act { flex:none; margin-top:12px; width:100%; }
.who-field { display:flex; flex-direction:column; gap:6px; }
.who-field > b { font-family:var(--display); font-size:11px; letter-spacing:.14em;
                 color:var(--gold); font-weight:400; }
.who-rail { display:flex; flex-wrap:wrap; gap:6px; }
.who-opt { font-family:'Rakkas', Georgia, serif; font-size:12.5px; color:var(--bone);
           background:rgba(10,7,20,.7); border:0; padding:6px 10px; cursor:pointer;
           box-shadow:0 0 0 1px rgba(227,178,60,.24); transition:box-shadow .15s, background .15s; }
.who-opt:hover { box-shadow:0 0 0 1px rgba(227,178,60,.62); background:rgba(28,20,48,.85); }
.who-opt.on { background:rgba(227,178,60,.16); box-shadow:0 0 0 2px var(--gold); }
/* A swatch has to BE the colour — a labelled chip makes picking a skin tone
   an act of reading rather than of looking. */
.who-opt.sw { width:38px; height:30px; padding:0; background:var(--sw); }
.who-opt.sw:hover { background:var(--sw); }
.who-opt.sw.on { background:var(--sw); box-shadow:0 0 0 2px var(--gold), 0 0 14px rgba(227,178,60,.5); }

/* THE BLOCK — the eight starting characters. Wider than a swatch because each
   one carries a name and a trade; a grid rather than a wrap so the row reads
   as a cast list instead of a ragged rail. */
.who-opt.who-face { display:flex; align-items:center; gap:8px; padding:7px 10px 7px 7px;
  text-align:left; min-width:0; }
.who-face-chip { width:22px; height:22px; flex:none; border-radius:50%;
  background:var(--sw); box-shadow:inset 0 0 0 1px rgba(244,236,216,.28); }
.who-face-t { display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.who-face-t b { font-family:var(--display); font-size:12.5px;
  letter-spacing:.06em; font-weight:400; color:var(--bone); }
.who-face-t i { font-style:normal; font-size:10.5px; letter-spacing:.04em;
  color:rgba(244,236,216,.6); }
.who-opt.who-face.on .who-face-t i { color:var(--gold); }
/* Four across, so eight people are TWO rows and not four.
   Measured at the owner's 1036x476: a two-column grid put four names on screen
   and pushed LIKENESS, SKIN, HAIR, FIT and TRADE off the bottom — the sheet
   then offered a cast of four and hid the word "customize" entirely. The
   column count keys off WIDTH only; height has nothing to do with how many
   fit side by side, and keying it to height was the bug. */
.who-field:has(.who-face) .who-rail {
  display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; }
@media (max-width: 620px) {
  .who-field:has(.who-face) .who-rail { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .who-face-t i { display:none; }
}
/* Short windows tighten the row rather than reflowing it. */
@media (max-height: 560px) {
  .who-opt.who-face { padding:5px 8px 5px 5px; gap:6px; }
  .who-face-chip { width:18px; height:18px; }
  .who-face-t i { font-size:9.5px; }
}
.who-input { font-family:'Rakkas', Georgia, serif; font-size:15px; color:var(--bone);
             background:rgba(10,7,20,.72); border:0; padding:9px 12px; width:100%;
             box-shadow:0 0 0 1px rgba(227,178,60,.24); }
.who-input:focus { outline:none; box-shadow:0 0 0 2px var(--gold); }
.who-input::placeholder { color:#6E6588; }

@media (max-width:720px) {
  .sheet.who { margin-left:auto; }
  .who-opt.sw { width:32px; height:26px; }
}

/* ── The first week ───────────────────────────────────────────────────
   Sits on the left rail under the brand, the one column of the HUD that was
   empty. Same notched panel language as everything else — a rounded card
   would read as a web widget floating over a world instead of part of it. */
.tutor { position:fixed; left:18px; top:132px; width:min(310px,74vw); padding:12px 14px 10px;
         background:linear-gradient(160deg, rgba(16,19,46,.93), rgba(10,7,20,.96));
         box-shadow:var(--edge); opacity:0; transform:translateX(-10px);
         transition:opacity .3s, transform .3s; pointer-events:auto;
         border-radius:13px; }
.tutor.on { opacity:1; transform:translateX(0); }
.tutor-head { display:flex; align-items:center; gap:8px; }
.tutor-icon { font-size:17px; }
.tutor-title { font-family:var(--display); font-size:15px; letter-spacing:.07em;
               color:var(--gold); font-weight:400; }
.tutor-hint { font-size:13px; line-height:1.5; color:#C6B79A; margin-top:6px; }
.tutor-foot { display:flex; align-items:center; gap:9px; margin-top:10px;
              border-top:1px solid rgba(227,178,60,.2); padding-top:8px; }
.tutor-dots { display:flex; gap:4px; flex:1; }
/* A dot you have not reached is a hollow mark, not a dim one — "later" and
   "off" should not look the same. */
.tutor-dot { width:8px; height:8px; background:transparent;
             box-shadow:inset 0 0 0 1px rgba(227,178,60,.38); }
.tutor-dot.done { background:var(--gold); box-shadow:none; }
.tutor-dot.now { background:var(--ember); box-shadow:0 0 8px rgba(232,132,60,.75); }
.tutor-count { font-family:var(--display); font-size:11px; color:#8C82A6;
               letter-spacing:.08em; }
.tutor-skip { font-family:var(--display); font-size:11px; letter-spacing:.1em;
              background:none; border:0; color:#8C82A6; cursor:pointer; padding:2px 4px; }
.tutor-skip:hover { color:var(--ember); }

@media (max-height:700px) { .tutor { top:auto; bottom:132px; } }

/* ── Toasts ───────────────────────────────────────────────────────────── */
.toasts { position:fixed; left:50%; top:12%; transform:translateX(-50%);
          display:flex; flex-direction:column; gap:7px; align-items:center; pointer-events:none; }
.toast { font-size:14px; letter-spacing:.04em; padding:9px 20px; color:var(--bone);
         background:linear-gradient(160deg, rgba(16,19,46,.95), rgba(10,7,20,.97));
         box-shadow:var(--edge); opacity:1; transition:opacity .5s, transform .5s;
         border-radius:12px; }
.toast.good { box-shadow:0 0 0 1px rgba(95,224,138,.5), 0 6px 22px rgba(0,0,0,.55); }
.toast.bad  { box-shadow:0 0 0 1px rgba(224,90,90,.55), 0 6px 22px rgba(0,0,0,.55); }
.toast.out  { opacity:0; transform:translateY(-10px); }

/* The blackout banner turns from a warning into a scoreboard when your own
   power is carrying streets that are not yours. */
#hud-crisis.carrying { background:linear-gradient(160deg, rgba(120,86,20,.95), rgba(58,38,10,.96));
                       box-shadow:0 0 0 1px var(--gold), 0 10px 34px rgba(0,0,0,.6);
                       color:#FFE9BC; }

@media (max-width:720px) {
  .keys { display:none; }
  #hud-pillars { flex-wrap:wrap; justify-content:flex-end; max-width:56vw; }
  .sheet { padding:20px; }
}
@media (prefers-reduced-motion: reduce) {
  #hud-crisis { transition:none; }
}
/* ── THE SITE'S TWO REMAINING SIGNATURES ────────────────────────────────
   Read off quantummelaninmedia.com and QUAN-TESS, not invented:

   1. THE EYEBROW PILL. Both heroes open with a bordered, fully-rounded pill
      holding small-caps gold at wide tracking — "✦ CATCH THE MYTH · BECOME THE
      FISHERMAN", "✦ THE AKASHIC AI · BUILT ON THE SIX BOOKS". Every section
      label in this game was already that text; it was just never given the pill.

   2. FULLY-ROUNDED BUTTONS. Every call to action on both sites is a pill:
      primary in a gold gradient with dark text, secondary outlined. The game's
      buttons were square-cornered blocks. */
.ge-eyebrow, .rl-eyebrow, .who-field > b, .door-group b {
  display:inline-flex; align-items:center; gap:.5em; align-self:flex-start;
  font-family:var(--sans); font-size:10px; font-weight:600;
  letter-spacing:.17em; text-transform:uppercase; color:var(--gold);
  border:1px solid rgba(232,194,90,.42); border-radius:999px;
  padding:4px 11px; background:rgba(232,194,90,.07);
  /* A pill is a single-line shape. Anything long enough to wrap inside one
     stops reading as a label and starts reading as a broken button, so the
     text is kept on one line and the pill grows with it. */
  white-space:nowrap; max-width:100%; }
.ge-eyebrow::before, .rl-eyebrow::before,
.who-field > b::before, .door-group b::before { content:'✦'; opacity:.8; }

/* Primary: the gold gradient pill, dark text. Both sites' main CTA. */
.act.go, .sheet-close, .ge-close, .rl-close, .rl-accept, .ge-jump, #btn-more {
  border-radius:999px; font-family:var(--sans); font-weight:600;
  letter-spacing:.02em; text-transform:none; }
.act.go, .sheet-close, .ge-close, .rl-close, .rl-accept {
  background:linear-gradient(180deg, var(--gold-hi), var(--gold));
  color:#1a1206; border:0; }
.act.go:hover, .sheet-close:hover, .ge-close:hover,
.rl-close:hover, .rl-accept:hover { filter:brightness(1.07); }

/* Secondary: outlined pill, gold text. */
.act, .rl-reply, .rl-supply, .ge-row, .door, .who-opt, .abtn3 {
  border-radius:999px; font-family:var(--sans); }
.act { font-weight:600; letter-spacing:.02em; text-transform:none;
       border:1px solid var(--line); }
/* The rows that hold two stacked lines stay softly rounded rather than fully
   pilled — a 999px radius on a 56px-tall row bows the text off its own edges. */
.ge-row, .rl-supply, .who-opt.who-face, .abtn3, .door { border-radius:12px; }
.sheet { border-radius:16px; }
.who-opt.sw { border-radius:8px; }

/* ── ☰ MORE — the hidden menu ───────────────────────────────────────────
   Parity with the 2D game's #more-wrap. The 3D world had all of these verbs
   bound to keys and advertised only in a thirteen-item legend along the
   bottom, which is how you ship a feature nobody finds. */
#more-wrap { position:relative; pointer-events:auto; align-self:flex-end; }
.abtn3 { display:flex; align-items:center; gap:8px; width:100%;
  font-family:var(--display); font-size:13px; letter-spacing:.09em;
  color:var(--bone); cursor:pointer; text-align:left; text-decoration:none;
  padding:9px 13px; border-radius:8px; border:1px solid transparent;
  background:linear-gradient(160deg, rgba(30,21,51,.92), rgba(13,9,24,.95));
  transition:background var(--ease), border-color var(--ease), transform var(--ease); }
.abtn3:hover { background:var(--card-hi); border-color:var(--line); transform:translateY(-1px); }
.abtn3 kbd { margin-left:auto; font-family:var(--display); font-size:11px;
  color:var(--ink); background:var(--gold); border-radius:3px; padding:1px 7px; }
.abtn3.hot { border-color:rgba(232,194,90,.5); }
.abtn3.hot kbd { background:var(--violet); color:#fff; }
.abtn3.join { color:var(--gold-hi); border-color:rgba(232,194,90,.35); }
.abtn3.danger { color:#ff9a8a; }
.abtn3.switch { color:var(--violet); }

#btn-more { width:auto; justify-content:center; padding:10px 18px;
  box-shadow:0 0 0 1px rgba(232,194,90,.3), 0 8px 22px rgba(0,0,0,.5);
  backdrop-filter:blur(7px); }
#btn-more.on { background:var(--gold); color:var(--ink); border-color:var(--gold); }

#more-pop { position:absolute; right:0; bottom:calc(100% + 10px); display:none;
  flex-direction:column; gap:5px; width:264px; padding:9px; border-radius:12px;
  background:linear-gradient(165deg, rgba(22,15,36,.97), rgba(7,5,13,.98));
  border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(0,0,0,.72), 0 0 0 1px rgba(232,194,90,.14);
  backdrop-filter:blur(10px); }
#more-pop.show { display:flex; }
@media (max-height: 560px) {
  #more-pop { width:236px; }
  .abtn3 { padding:7px 11px; font-size:12px; }
}
@media (prefers-reduced-motion: reduce) { .abtn3 { transition:none; } }

/* ── THE GOD'S EYE ──────────────────────────────────────────────────────
   The QMM house palette — quantummelaninmedia.com, the same tokens QUAN-TESS
   runs on: gold on deep indigo, violet for the world. Declared locally rather
   than pushed into :root, because the WORLD's colours come from src/config.js
   PAL, which is shared with the 2D game and must not move. */
.godseye {
  --ge-gold:#e8c25a; --ge-gold-hi:#f5dc8e; --ge-violet:#a877e6;
  --ge-ink:#07050d; --ge-card:#160f24; --ge-card-hi:#1e1533;
  --ge-line:#2c2140; --ge-txt:#f3efe6; --ge-mut:#a99fc0;
  position:fixed; inset:0; z-index:60; display:none; pointer-events:auto;
  color:var(--ge-txt); font-family:'Rakkas', Georgia, serif;
  /* The globe is drawn on the canvas BEHIND this layer, so the backdrop has to
     stay transparent — a background here would hide the Earth entirely. */
  background:transparent; cursor:grab;
}
.godseye.on { display:block; }
.godseye:active { cursor:grabbing; }

/* The block's HUD comes off while the Earth is up. Everything in it — the
   readiness dial, the pillar chips, the [E] prompt, the key legend — describes
   a block you are not looking at, and on the first render it all collided with
   the globe's own header and hint. See main3d.js openGodsEye for why this is
   not the "never display:none a panel" rule being broken, and for why it is a
   deliberate one-off rather than a pattern: nothing else here hides #hud. */
body.godseye-open #hud,
body.godseye-open .toasts,
body.godseye-open .tutor { display:none; }

.ge-head { position:absolute; top:0; left:0; right:0; padding:18px 22px;
  display:flex; align-items:baseline; gap:16px; pointer-events:none;
  background:linear-gradient(180deg, rgba(7,5,13,.92), rgba(7,5,13,0)); }
.ge-head h2 { font-family:var(--display); margin:0;
  font-size:clamp(22px,2.6vw,34px); letter-spacing:.06em; color:var(--ge-gold);
  text-shadow:0 2px 18px rgba(232,194,90,.35); }
.ge-sub { font-size:13px; color:var(--ge-mut); letter-spacing:.04em; flex:1; }
.ge-close { pointer-events:auto; font-family:var(--display);
  font-size:13px; letter-spacing:.1em; border:0; cursor:pointer; padding:9px 20px;
  color:var(--ge-ink); background:linear-gradient(180deg,var(--ge-gold-hi),var(--ge-gold));
  border-radius:3px; transition:filter .16s ease, transform .16s ease; }
.ge-close:hover { filter:brightness(1.08); transform:translateY(-1px); }

/* The reading column. Its own scroll, never squeezed by anything else —
   the dock rule from the 2D game applies here too. */
.ge-side { position:absolute; top:76px; right:18px; bottom:52px; width:352px;
  overflow-y:auto; display:flex; flex-direction:column; gap:10px;
  padding-right:6px; pointer-events:auto;
  scrollbar-width:thin; scrollbar-color:var(--ge-gold) transparent; }
.ge-side::-webkit-scrollbar { width:7px; }
.ge-side::-webkit-scrollbar-thumb { background:var(--ge-gold); border-radius:4px; }

.ge-eyebrow { font-family:var(--display); font-size:12px;
  letter-spacing:.16em; color:var(--ge-violet); margin-top:6px; }
.ge-card, .ge-twin, .ge-flat {
  background:linear-gradient(165deg, rgba(30,21,51,.93), rgba(13,9,24,.95));
  border:1px solid var(--ge-line); border-radius:10px; padding:14px 16px;
  backdrop-filter:blur(6px); box-shadow:0 10px 30px rgba(0,0,0,.45); }
.ge-twin { border-color:rgba(232,194,90,.45);
  box-shadow:0 0 0 1px rgba(232,194,90,.16), 0 10px 30px rgba(0,0,0,.5); }
.ge-twin-name { font-family:var(--display); font-size:21px;
  letter-spacing:.05em; color:var(--ge-gold-hi); margin:2px 0 6px; }
.ge-card-h { display:flex; align-items:center; gap:9px; }
.ge-card-h b { font-family:var(--display); font-size:17px;
  letter-spacing:.05em; color:var(--ge-txt); font-weight:400; }
.ge-ico { font-size:16px; }
.ge-big { font-family:var(--display); font-size:30px;
  line-height:1.1; color:var(--ge-gold); margin:4px 0 2px; }
.ge-meta { font-size:12.5px; color:var(--ge-mut); line-height:1.5; }
/* THE RECEIPT — the market question, verbatim. Violet rule down the left so it
   reads as a quotation from outside, not as our own copy. */
.ge-receipt { margin-top:9px; padding:8px 0 8px 12px; font-size:12.5px;
  line-height:1.5; color:var(--ge-txt); opacity:.86;
  border-left:3px solid var(--ge-violet); background:rgba(168,119,230,.07); }

.ge-list { display:flex; flex-direction:column; gap:5px; }
.ge-row { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  cursor:pointer; padding:9px 12px; border-radius:8px; color:var(--ge-txt);
  font-family:'Rakkas', Georgia, serif; font-size:14px;
  background:rgba(22,15,36,.82); border:1px solid transparent;
  transition:background .16s ease, border-color .16s ease, transform .16s ease; }
.ge-row:hover { background:var(--ge-card-hi); border-color:var(--ge-line); transform:translateX(2px); }
.ge-row.on { border-color:var(--ge-gold); background:rgba(232,194,90,.13); }
.ge-row-t { display:flex; flex-direction:column; line-height:1.3; }
.ge-row-t b { font-weight:400; letter-spacing:.03em; }
.ge-row-t i { font-style:normal; font-size:11.5px; color:var(--ge-mut); }
.ge-jump { margin-top:8px; width:100%; cursor:pointer; border:1px solid var(--ge-gold);
  background:rgba(232,194,90,.14); color:var(--ge-gold-hi); border-radius:7px;
  font-family:var(--display); font-size:13px; letter-spacing:.09em;
  padding:9px 12px; transition:background .16s ease; }
.ge-jump:hover { background:rgba(232,194,90,.26); }
.ge-flat b { display:block; font-weight:400; color:var(--ge-gold); font-size:13px; letter-spacing:.04em; }
.ge-flat span { font-size:12px; color:var(--ge-mut); line-height:1.45; }

.ge-hint { position:absolute; left:22px; bottom:18px; font-size:12px;
  letter-spacing:.09em; color:var(--ge-mut); pointer-events:none;
  text-shadow:0 2px 10px rgba(0,0,0,.9); }

/* Narrow windows — including the owner's 1036x476 — get the column as a
   bottom sheet rather than losing it. No panel is ever display:none'd by
   another panel's state; that rule cost this project a whole UI rework. */
@media (max-width: 900px), (max-height: 560px) {
  .ge-side { top:auto; right:0; left:0; bottom:0; width:auto; max-height:46vh;
    padding:12px 16px 14px;
    background:linear-gradient(180deg, rgba(7,5,13,0), rgba(7,5,13,.96) 18%); }
  .ge-hint { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  .ge-row, .ge-close, .ge-jump { transition:none; }
}

/* ── THE RELIEF RUN ─────────────────────────────────────────────────────
   Same chrome language as THE GOD'S EYE, one layer up. */
.relief {
  position:fixed; inset:0; z-index:62; display:none; pointer-events:auto;
  color:var(--bone); font-family:'Rakkas', Georgia, serif; background:transparent;
}
.relief.on { display:block; }
.rl-head { position:absolute; top:0; left:0; right:0; padding:18px 22px;
  display:flex; align-items:baseline; gap:16px; pointer-events:none;
  background:linear-gradient(180deg, rgba(7,5,13,.92), rgba(7,5,13,0)); }
.rl-head h2 { font-family:var(--display); margin:0;
  font-size:clamp(20px,2.3vw,30px); letter-spacing:.06em; color:var(--gold);
  text-shadow:0 2px 18px rgba(232,194,90,.35); }
.rl-sub { font-size:13px; color:var(--mut); letter-spacing:.04em; flex:1; }
.rl-close { pointer-events:auto; font-family:var(--display);
  font-size:13px; letter-spacing:.1em; border:0; cursor:pointer; padding:9px 20px;
  color:var(--ink); background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  border-radius:3px; transition:filter var(--ease), transform var(--ease); }
.rl-close:hover { filter:brightness(1.08); transform:translateY(-1px); }

.rl-side { position:absolute; top:74px; right:18px; bottom:18px; width:372px;
  overflow-y:auto; display:flex; flex-direction:column; gap:9px; padding-right:6px;
  pointer-events:auto; scrollbar-width:thin; scrollbar-color:var(--gold) transparent; }
.rl-side::-webkit-scrollbar { width:7px; }
.rl-side::-webkit-scrollbar-thumb { background:var(--gold); border-radius:4px; }

/* THE DISCLAIMER. Violet, at the top, never collapsible. The alert is real and
   the person is not, and the sheet says so before it says anything else. */
.rl-real { border:1px solid rgba(168,119,230,.55); border-radius:10px; padding:11px 14px;
  background:linear-gradient(165deg, rgba(50,32,82,.92), rgba(18,12,32,.95)); }
.rl-real b { display:block; font-family:var(--display); font-size:12px;
  letter-spacing:.11em; color:var(--violet); font-weight:400; margin-bottom:4px; }
.rl-real span { font-size:12px; line-height:1.5; color:var(--mut); }

.rl-card { background:linear-gradient(165deg, rgba(30,21,51,.93), rgba(13,9,24,.95));
  border:1px solid var(--line); border-radius:10px; padding:13px 15px;
  backdrop-filter:blur(6px); box-shadow:0 10px 30px rgba(0,0,0,.45); }
.rl-eyebrow { font-family:var(--display); font-size:11.5px;
  letter-spacing:.16em; color:var(--violet); }
.rl-where { font-family:var(--display); font-size:18px;
  letter-spacing:.04em; color:var(--gold-hi); margin-top:3px; }
.rl-name { font-family:var(--display); font-size:19px;
  letter-spacing:.05em; color:var(--gold-hi); margin:3px 0 5px; }
.rl-said { font-size:14px; line-height:1.55; color:var(--bone); }
.rl-meta { font-size:12px; line-height:1.5; color:var(--mut); margin-top:5px; }
.rl-receipt { margin-top:8px; padding:7px 0 7px 12px; font-size:12px; line-height:1.5;
  color:var(--bone); opacity:.86; border-left:3px solid var(--violet);
  background:rgba(168,119,230,.07); }

.rl-reply { width:100%; text-align:left; cursor:pointer; padding:10px 14px;
  border-radius:8px; font-family:'Rakkas', Georgia, serif; font-size:13.5px;
  color:var(--bone); background:rgba(22,15,36,.85); border:1px solid var(--line);
  transition:background var(--ease), border-color var(--ease), transform var(--ease); }
.rl-reply:hover { background:var(--card-hi); border-color:var(--gold); transform:translateX(2px); }

/* TAKE THE RUN. The one commitment on this sheet, so it carries the gold. */
.rl-accept { width:100%; cursor:pointer; padding:12px 14px; border-radius:8px;
  font-family:var(--display); font-size:15px; letter-spacing:.09em;
  color:var(--ink); border:0;
  background:linear-gradient(180deg, var(--gold-hi), var(--gold));
  transition:filter var(--ease), transform var(--ease); }
.rl-accept:hover { filter:brightness(1.07); transform:translateY(-1px); }

.rl-supply { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  cursor:pointer; padding:9px 13px; border-radius:8px; color:var(--bone);
  font-family:'Rakkas', Georgia, serif; background:rgba(22,15,36,.85);
  border:1px solid transparent;
  transition:background var(--ease), border-color var(--ease), transform var(--ease); }
.rl-supply:hover:not(:disabled) { background:var(--card-hi); border-color:var(--line); transform:translateX(2px); }
/* What they actually asked for is marked, because sending the wrong thing is
   allowed and pays less — the player should be able to see the difference. */
.rl-supply.need { border-color:var(--gold); background:rgba(232,194,90,.13); }
.rl-supply.short, .rl-supply:disabled { opacity:.42; cursor:not-allowed; }
.rl-ico { font-size:17px; }
.rl-supply-t { display:flex; flex-direction:column; line-height:1.3; }
.rl-supply-t b { font-family:var(--display); font-size:13px;
  letter-spacing:.06em; font-weight:400; }
.rl-supply-t i { font-style:normal; font-size:11px; color:var(--mut); }

/* ── THE GPS MARKER ──────────────────────────────────────────────────────
   Positioned in PIXELS by waypoint.js against the projected target, so it is
   translated onto its own point and never laid out by the document. `left` and
   `top` are the anchor; the transform centres it on that anchor.

   pointer-events:none throughout — it sits over the world and must never eat
   a drag-to-look, which is the gesture you use most while following it. */
.wp { position:fixed; z-index:40; pointer-events:none; opacity:0;
  transform:translate(-50%,-50%); display:flex; flex-direction:column;
  align-items:center; gap:5px; transition:opacity .22s var(--ease); }
.wp.on { opacity:1; }
/* The arrow. A CSS triangle, so it costs no asset and takes the gold token.
   Upright (pointing down at the spot) when the target is on screen; rotated to
   the bearing when it is off. */
.wp-arrow { width:0; height:0; border:11px solid transparent;
  border-top-color:var(--gold); filter:drop-shadow(0 2px 5px rgba(0,0,0,.65));
  transition:transform .12s linear; }
.wp-body { display:flex; flex-direction:column; align-items:center; line-height:1.15;
  padding:5px 11px; border-radius:999px; white-space:nowrap;
  background:rgba(7,5,13,.82); border:1px solid rgba(232,194,90,.55);
  backdrop-filter:blur(4px); box-shadow:0 4px 16px rgba(0,0,0,.5); }
.wp-body b { font-family:var(--display); font-weight:400; font-size:13px;
  letter-spacing:.06em; color:var(--gold-hi); }
.wp-body span { font-family:var(--sans); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--mut); }
/* ⚠ THE EDGE IS THE NORMAL CASE HERE, which is why this no longer hides the
   label. The chase camera is pitched about 30 degrees down and the vertical
   half-FOV is 29, so THE HORIZON SITS AT THE TOP OF THE FRAME — every distant
   ground target projects above it. Measured: the spring, faced head on from
   32 metres, lands at NDC y = 1.05.

   The first version dropped the place's NAME whenever the marker was off
   frame, on the theory that off frame meant "behind you". It does not. It
   meant the label vanished for almost the whole walk and came back only in
   the last few strides, which is the opposite of useful.

   So the edge state is now only a TINT and an arrow rotation. The name stays. */
.wp.edge .wp-body { border-color:rgba(232,194,90,.8); }
.wp.edge .wp-body span { color:var(--gold); }
/* Arrived. Green, matching RECEIVED, because both mean "this step is done". */
.wp.near .wp-body { border-color:rgba(61,255,154,.75); }
.wp.near .wp-body b { color:#3DFF9A; }
.wp.near .wp-body span { color:#CFFFE6; }
.wp.near .wp-arrow { border-top-color:#3DFF9A; animation:wp-bob .9s ease-in-out infinite; }
@keyframes wp-bob { 50% { transform:translateY(4px); } }
@media (prefers-reduced-motion: reduce) {
  .wp-arrow { transition:none; animation:none; }
}

/* RECEIVED. The one green on a gold-and-violet screen, so it reads as nothing
   but "it got there". Centred on the SCENE, not the window — the side column
   owns the right 390px. */
.rl-received { position:absolute; top:24%; left:calc((100% - 390px) / 2);
  transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none;
  text-align:center; white-space:nowrap; }
.rl-received b { display:block; font-family:var(--display); font-weight:400;
  font-size:clamp(38px, 6.4vw, 78px); letter-spacing:.06em; color:#3DFF9A;
  text-shadow:0 0 18px rgba(61,255,154,.85), 0 0 60px rgba(61,255,154,.45), 0 2px 0 #06140d; }
.rl-received span { display:inline-block; margin-top:8px; padding:5px 16px; border-radius:999px;
  font-family:var(--sans); font-size:13px; letter-spacing:.14em; text-transform:uppercase;
  color:#CFFFE6; background:rgba(6,20,13,.78); border:1px solid rgba(61,255,154,.6); }
.rl-received.on { animation:rl-stamp 2.6s var(--ease) forwards; }
.rl-received.dry b { color:var(--mut); text-shadow:none; font-size:clamp(22px, 3.4vw, 40px); }
.rl-received.dry span { color:var(--mut); border-color:var(--line); }
@keyframes rl-stamp {
  0% { opacity:0; transform:translate(-50%,-50%) scale(.6); }
  7% { opacity:1; transform:translate(-50%,-50%) scale(1.12); }
  13% { transform:translate(-50%,-50%) scale(1); }
  80% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  100% { opacity:0; transform:translate(-50%,-62%) scale(1); }
}
.rl-bubble { position:absolute; transform:translate(-50%,-100%) scale(.85); opacity:0;
  max-width:260px; padding:9px 14px; border-radius:14px; pointer-events:none;
  font-family:var(--sans); font-size:14px; line-height:1.4; color:#07120c;
  background:#E9FFF3; border:2px solid #3DFF9A; box-shadow:0 6px 24px rgba(0,0,0,.45);
  transition:opacity .3s var(--ease), transform .3s var(--ease); }
.rl-bubble::after { content:''; position:absolute; left:50%; bottom:-9px; margin-left:-8px;
  border:8px solid transparent; border-bottom:0; border-top-color:#3DFF9A; }
.rl-bubble.on { opacity:1; transform:translate(-50%,-100%) scale(1); }
.rl-card.rl-ok { border-color:rgba(61,255,154,.7); box-shadow:0 0 22px rgba(61,255,154,.18); }
.rl-card.rl-ok .rl-eyebrow { color:#3DFF9A; border-color:rgba(61,255,154,.6); }

/* WIDTH ONLY. This used to fire on max-height:560 too, and at the owner's
   1036x476 that turned the column into a bottom sheet over the lower half of
   the screen — which is exactly where the person stands. A short window has
   plenty of room for a column beside the scene; it only has to scroll. */
@media (max-width: 900px) {
  .rl-received { left:50%; top:20%; }
  .rl-side { top:auto; right:0; left:0; bottom:0; width:auto; max-height:52vh;
    padding:12px 16px 14px;
    background:linear-gradient(180deg, rgba(7,5,13,0), rgba(7,5,13,.96) 16%); }
}
@media (prefers-reduced-motion: reduce) {
  .rl-reply, .rl-supply, .rl-close { transition:none; }
}

/* shown only when the device cannot draw WebGL — see the gate script below */
#nogl{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:24px;
  background:#0A0714;color:#F4ECD8;font:600 18px/1.5 system-ui,-apple-system,sans-serif;text-align:center}
#nogl b{display:block;color:#E3B23C;font-size:1.3em;margin-bottom:.4em}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="row">
    <div class="brand">
      <!-- Two-tone, the way both hero lockups on his sites are set: the first
           word in gold, the rest in bone. -->
      <h1><span class="lead">C.U.I.</span> F.A.C.T.S.</h1>
      <div class="facts">
        <span><b>F</b>OOD</span><span><b>A</b>RT</span><span><b>C</b>LOTHES</span>
        <span><b>T</b>ECH</span><span><b>S</b>HELTER</span>
      </div>
      <div class="kente"></div>
      <a class="switch2d" href="https://quantummelaninmedia.com/cui/"
         title="The same block, top-down — the original">CLASSIC 2D ↗</a>
    </div>
    <div id="hud-pillars"></div>
  </div>

  <div id="hud-crisis"></div>

  <div class="row">
    <!-- THE STAT ROW, which is the site's most recognisable component: a big
         gold numeral over a tiny uppercase muted label, repeated across a
         hairline. quantummelaninmedia.com runs "5 FREE BROWSER GAMES / 7 BOOKS
         ON AMAZON / 47 DROPS ON GUMROAD"; QUAN-TESS runs "6 BOOKS IN HIS
         LIBRARY / 29 CRAFT SKILLS". The block's numbers are the same shape of
         fact, and they were previously one run-on line of poster type. -->
    <div class="panel stats">
      <div class="stat"><b id="hud-day">1</b><i>Day</i></div>
      <div class="stat"><b id="hud-unity">0</b><i>Unity</i></div>
      <div class="stat"><b id="hud-ready">0%</b><i>Ready</i></div>
      <div class="stat"><b id="hud-clock">00:00</b><i>Time</i></div>
    </div>
    <!-- The keys you actually hold. Everything else moved behind MORE, the
         same way the 2D game does it: a thirteen-item legend is not a control
         scheme, it is a wall of text nobody reads twice. -->
    <div class="keys">
      <span><kbd>WASD</kbd> walk</span>
      <span><kbd>SHIFT</kbd> run</span>
      <span><kbd>E</kbd> act</span>
      <span><kbd>F</kbd> raise / claim</span>
      <span><kbd>DRAG</kbd> look</span>
    </div>

    <!-- ☰ MORE — the hidden menu, matching the 2D game's #more-wrap. Every
         item here is a key that already worked and that nobody could find. -->
    <div id="more-wrap">
      <button class="abtn3" id="btn-more" aria-haspopup="true" aria-expanded="false">☰ MORE</button>
      <div id="more-pop">
        <button class="abtn3 hot" id="m-godseye">🌍 THE GOD'S EYE <kbd>G</kbd></button>
        <button class="abtn3" id="m-build">🧱 BUILD <kbd>B</kbd></button>
        <button class="abtn3" id="m-todo">📋 THE BLOCK'S TO-DO <kbd>T</kbd></button>
        <button class="abtn3 join" id="m-doors">✊ JOIN THE MOVEMENT <kbd>J</kbd></button>
        <button class="abtn3" id="m-answer">🙋 RE-OPEN THE ASK <kbd>R</kbd></button>
        <button class="abtn3" id="m-music">♪ MUSIC <kbd>M</kbd></button>
        <button class="abtn3" id="m-sound">🔊 SOUND <kbd>N</kbd></button>
        <a class="abtn3 switch" id="m-2d" href="https://quantummelaninmedia.com/cui/"
           title="The same block, top-down — the original">🧭 CLASSIC 2D ↗</a>
        <button class="abtn3 danger" id="m-reset">RESET BLOCK</button>
      </div>
    </div>
  </div>
</div>

<script>window.CUI_AUDIO_BASE='../audio/';window.CUI_CLASSIC_URL='../'</script>
<script>
// WebGL gate. Without it a phone or browser that cannot draw WebGL gets a black
// canvas and a three.js exception — never a word of explanation. The site deploy
// sets window.CUI_CLASSIC_URL (the 2D block: same save, same brain) and we go
// there; a dev build leaves it unset and just says so. `?nogl=1` forces the
// no-WebGL path so the fallback can be TESTED — a check nobody has seen fail is
// a rumour.
(function () {
  var forced = /[?&]nogl=1(&|$)/.test(location.search);
  var gl = null;
  if (!forced) {
    try { var c = document.createElement('canvas'); gl = c.getContext('webgl2') || c.getContext('webgl'); } catch (e) { gl = null; }
  }
  if (gl) return;
  var classic = window.CUI_CLASSIC_URL;
  var note = document.createElement('div');
  note.id = 'nogl';
  note.innerHTML = '<div><b>This device can’t draw the 3D world.</b>' +
    (classic ? 'Taking you to the Classic 2D block — same save, same rules.' : 'No WebGL here — try another browser or device.') + '</div>';
  document.body.appendChild(note);
  if (classic) setTimeout(function () { location.replace(classic); }, 1800);
})();
</script>
<script src="./bundle.js?v=1790045229140"></script>
</body>
