<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>QM85: Quantum Run — Quantum Melanin Media</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    {
      "imports": {

  </script>
  <style>
    :root { --violet: #9b4dff; --gold: #d4a73a; --ink: #07020f; --text: #efe6ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: Inter, sans-serif; }
    #stage canvas { display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 18px Orbitron, sans-serif; letter-spacing: .15em; color: var(--violet); z-index: 7;
      background: linear-gradient(rgba(7, 2, 15, .72), rgba(7, 2, 15, .92)), url("assets/cover_small.jpg?v=qm85sheet") center / cover #07020f; /* covers the half-built city */
      text-shadow: 0 0 14px rgba(155, 77, 255, .8); }
    #card { position: fixed; inset: 0; margin: auto; width: min(720px, calc(100% - 32px)); height: fit-content; max-height: calc(100% - 32px); overflow: auto;

    /* HOME: the owner's QM85 character sheet IS the title screen (at 1036×476 a stacked card hid it above the fold) */
    #card.home { width: 100%; max-height: 100%; height: 100%; margin: 0; padding: 16px 28px 18px; border: none; border-radius: 0; overflow: hidden;

      background: linear-gradient(to top, rgba(8, 5, 16, .96) 0, rgba(8, 5, 16, .55) 38%, rgba(8, 5, 16, 0) 68%),
        url("assets/cover.jpg?v=qm85sheet") center / cover no-repeat #08050f; }
    #card.home h1 { font-size: clamp(26px, 5vw, 54px); margin: 0 0 4px; text-shadow: 0 0 18px rgba(155, 77, 255, .8), 0 2px 6px #000; }
    #card.home .tag { margin: 0 0 10px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #e9dcff; text-shadow: 0 1px 4px #000; }
    #card.home .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    #card.home .actions button { margin: 0; }
    #card.home .howto { margin-top: 10px; max-width: 760px; font-size: 13px; }
    #card.home .howto summary { cursor: pointer; font: 700 12px Orbitron, sans-serif; letter-spacing: .12em; color: var(--gold); list-style: none; }
    #card.home .howto summary::before { content: "▸ "; }
    #card.home .howto[open] summary::before { content: "▾ "; }
    #card.home .howto .body { max-height: min(46vh, 300px); overflow: auto; margin-top: 6px; padding: 10px 14px; background: rgba(10, 4, 24, .85);
      border: 1px solid rgba(212, 167, 58, .45); border-radius: 10px; }
    #card.home .howto p { margin: 6px 0; line-height: 1.5; }
    #card h1, #card h2 { font-family: Orbitron, sans-serif; letter-spacing: .06em; margin: 14px 0 8px; color: var(--gold); }
    #card h1 span { color: var(--violet); }
    #card p { line-height: 1.55; margin: 8px 0; }
    #card .controls { font-size: 13px; opacity: .8; }
    #card button { margin-top: 14px; font: 900 16px Orbitron, sans-serif; letter-spacing: .12em; padding: 14px 28px; border-radius: 12px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, #6a1fd6, var(--violet)); border: 2px solid var(--gold); }
    #card button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    #hud { position: fixed; top: 14px; left: 16px; right: 16px; pointer-events: none; font-family: Orbitron, sans-serif; }
    #level-title { font-size: 14px; color: var(--gold); letter-spacing: .12em; }
    #stats { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 6px; font-size: 15px; text-shadow: 0 0 8px var(--violet); }
    #stats .shield { color: #bff6ff; }
    #stats .hint { font-family: Inter, sans-serif; font-size: 12px; opacity: .75; }
    #toast { position: fixed; top: 22%; left: 50%; transform: translate(-50%, -10px); font: 900 clamp(16px, 3vw, 28px) Orbitron, sans-serif; color: var(--gold);
      text-shadow: 0 0 18px var(--violet); opacity: 0; transition: .25s; pointer-events: none; text-align: center; width: calc(100% - 32px); }
    #toast.on { opacity: 1; transform: translate(-50%, 0); }
    /* crew callouts (Mahal): a pill under the toast — the bottom belongs to the boss bar + land prompt */
    #subtitle { position: fixed; top: 31%; left: 50%; transform: translateX(-50%); background: rgba(14, 6, 28, .78); padding: 7px 16px; border-radius: 20px;
      border: 1px solid rgba(180, 107, 255, .8); box-shadow: 0 0 14px rgba(155, 77, 255, .45); font: 700 15px Orbitron, sans-serif; letter-spacing: .04em;
      color: #f1e4ff; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
    #subtitle.on { opacity: 1; }
    .meter { flex-basis: 100%; display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .meter .bar { width: 200px; height: 10px; border: 1px solid var(--violet); border-radius: 6px; overflow: hidden; }
    .meter .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--violet), #d9b8ff); }
    .meter .bar.low i { background: #ff4d6d; }
    .meter.ready span { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
    .meter.ready .bar { border-color: var(--gold); box-shadow: 0 0 12px var(--gold); }
    .meter.ready .bar i { background: linear-gradient(90deg, var(--violet), var(--gold)); }
    #card button.secondary { background: transparent; margin-left: 10px; }
    #stats .boss { color: #8ff3ff; letter-spacing: -1px; }
    #reticle, #lock, #pointer { position: fixed; left: 0; top: 0; pointer-events: none; }
    #reticle { width: 50px; height: 50px; margin: -25px 0 0 -25px; /* owner 09-24: the circle was a little too small */ border: 2px solid rgba(217, 168, 255, .9); border-radius: 50%;
      box-shadow: 0 0 10px var(--violet); }
    #reticle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: var(--gold); border-radius: 50%; }
    /* TARGET MARKER (owner 09-24 late: "a better target marker for our bot view"): corner brackets sized to the bot on
       screen, a health bar, the range, and a gold MISSILE LOCK when Q would hit it. Bosses mark red. */
    #lock { width: 0; height: 0; --s: 64px; --c: #8ff3ff; --k: calc(var(--s) * .3); }
    #lock .ring { position: absolute; left: 0; top: 0; animation: lockpulse .7s ease-in-out infinite alternate; }
    #lock .c { position: absolute; width: var(--k); height: var(--k); border: 3px solid var(--c); filter: drop-shadow(0 0 5px var(--c)); }
    #lock .tl { left: calc(var(--s) / -2); top: calc(var(--s) / -2); border-right: 0; border-bottom: 0; }
    #lock .tr { left: calc(var(--s) / 2 - var(--k)); top: calc(var(--s) / -2); border-left: 0; border-bottom: 0; }
    #lock .bl { left: calc(var(--s) / -2); top: calc(var(--s) / 2 - var(--k)); border-right: 0; border-top: 0; }
    #lock .br { left: calc(var(--s) / 2 - var(--k)); top: calc(var(--s) / 2 - var(--k)); border-left: 0; border-top: 0; }
    #lock .dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; background: var(--c); transform: rotate(45deg); box-shadow: 0 0 8px var(--c); }
    #lock .hpbar { position: absolute; left: calc(var(--s) / -2); top: calc(var(--s) / 2 + 7px); width: var(--s); height: 6px; overflow: hidden; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .35); }
    #lock .hpbar i { display: block; height: 100%; background: var(--c); box-shadow: 0 0 6px var(--c); }
    #lock .tag { position: absolute; left: 0; top: calc(var(--s) / -2 - 20px); transform: translateX(-50%); white-space: nowrap;
      font: 800 12px Orbitron, sans-serif; letter-spacing: .14em; color: var(--c); text-shadow: 0 0 6px #000;
      padding: 2px 8px; background: rgba(8, 6, 20, .72); border: 1px solid var(--c); border-radius: 3px; /* readable on a bright sky */ }
    #lock.boss { --c: #ff4a4a; }
    #lock.locked { --c: #ffcf5a; }
    #lock.locked .ring { animation-duration: .22s; }
    #lock.locked .tag { animation: lockblink .44s steps(2) infinite; }
    @keyframes lockpulse { from { transform: scale(1); } to { transform: scale(1.12); } }
    @keyframes lockblink { 50% { opacity: .45; } }
    #pointer { width: 0; height: 0; margin: -10px 0 0 -10px; border-left: 20px solid #8ff3ff; border-top: 10px solid transparent; border-bottom: 10px solid transparent;
      transform-origin: 0 10px; }
    #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(transparent 50%, rgba(255, 40, 80, .55)); opacity: 0; }
    #flash.on { animation: hit .45s ease-out; }
    @keyframes hit { from { opacity: 1; } to { opacity: 0; } }
    #stats .blaster { color: #ffb338; }
    #stats .missiles { color: #ff8a5a; }
    /* TUTORIAL step card (tutorial.js) */
    #tutor { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(640px, calc(100% - 32px)); padding: 6px 16px; text-align: center; /* bottom strip: clear of the HUD, QM85 and the land prompt */
      background: rgba(10, 4, 24, .82); border: 2px solid var(--gold); border-radius: 12px; box-shadow: 0 0 24px rgba(212, 167, 58, .35); z-index: 4; pointer-events: none; }
    #tutor[hidden] { display: none; }
    #tutor b { display: block; font: 900 11px Orbitron, sans-serif; letter-spacing: .16em; color: var(--gold); margin-bottom: 2px; }
    #tutor span { font: 600 13px Orbitron, sans-serif; letter-spacing: .03em; color: var(--text); }
    #tutor i { display: block; margin-top: 2px; font: 500 10px Orbitron, sans-serif; letter-spacing: .12em; color: rgba(217, 168, 255, .6); font-style: normal; }
    @media (pointer: coarse) { #tutor { bottom: 56px; left: 16px; transform: none; max-width: calc(100% - 240px); } #tutor i { display: none; } } /* phone: bottom-left, clear of the button pad */
    #stats .missiles i { font-style: normal; opacity: .6; font-size: 11px; }
    /* MOBILE FIT: virtual stick (left) + buttons (right); only built on touch devices (touch.js) */
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 6; font-family: Orbitron, sans-serif; }
    #touch[hidden] { display: none; }
    #stick { position: absolute; left: 0; bottom: 0; width: 50%; height: 62%; pointer-events: auto; touch-action: none; }
    #stick span { position: absolute; left: 16px; bottom: 34px; font-size: 10px; letter-spacing: .12em; color: rgba(217, 168, 255, .55); }
    #stick .ring { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid rgba(217, 168, 255, .55); border-radius: 50%; display: none; }
    #stick .ring.live { display: block; }
    #stick .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(155, 77, 255, .55); border: 2px solid var(--gold); }
    #tbuttons { position: absolute; right: 14px; bottom: 16px; display: grid; grid-template-columns: repeat(2, 84px); gap: 10px; pointer-events: auto; touch-action: none; }
    #tbuttons .tb { height: 58px; border-radius: 14px; border: 2px solid var(--violet); background: rgba(10, 4, 24, .7); color: var(--text); font: 800 11px Orbitron, sans-serif; letter-spacing: .1em; touch-action: none; user-select: none; -webkit-user-select: none; }
    #tbuttons .tb.on { background: rgba(155, 77, 255, .65); border-color: var(--gold); }
    #tbuttons .tb-boost { grid-column: span 2; height: 66px; border-color: var(--gold); color: var(--gold); }
    #tbuttons .tb-fire { border-color: #ffb338; color: #ffb338; }
    #tbuttons .tb-brake { border-color: #8ff3ff; color: #8ff3ff; }
    #tbuttons .tb-missile { border-color: #ff8a5a; color: #ff8a5a; }
    #tbuttons .tb.brawl { border-color: #ff5a6a; color: #ffb3bb; } /* FIGHT MODE: BOOST -> PUNCH, AIRBRAKE -> DODGE */
    #tbuttons .tb-special { display: none; border-color: #ffcf5a; color: #ffcf5a; grid-column: span 2; height: 48px; } /* VLTRN pilots */
    #touch.has-special #tbuttons .tb-special { display: block; }
    #stats .special { color: #ffcf5a; }
    #stats .special.cool { opacity: .55; }
    #stats .special i { font-style: normal; opacity: .6; font-size: 11px; }
    .popup.style { color: #ff5a3c; font-size: 22px; letter-spacing: .08em; text-shadow: 0 0 10px #000, 0 0 16px rgba(46, 230, 168, .9); } /* 3BIZZLE's show-off words */
    @media (pointer: coarse) { #controls button { padding: 10px 12px; } #card.home .howto .body { max-height: 40vh; } }
    #credit { position: fixed; right: 12px; bottom: 8px; font-size: 11px; opacity: .7; pointer-events: none; }
    #controls { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 5; }
    #controls button { font: 600 13px Orbitron, sans-serif; color: var(--text); background: rgba(10, 4, 24, .75); border: 1px solid var(--violet);
      border-radius: 10px; padding: 8px 12px; cursor: pointer; letter-spacing: .08em; }
    #controls button:hover { border-color: var(--gold); color: var(--gold); }
    #controls button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #pause { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: rgba(7, 2, 15, .6);
      font: 900 clamp(28px, 6vw, 64px) Orbitron, sans-serif; color: var(--gold); letter-spacing: .15em; z-index: 4; }
    .pause-actions { display: flex; gap: 14px; justify-content: center; margin-top: 26px; }
    .pause-actions button { font: 900 16px Orbitron, sans-serif; letter-spacing: .12em; padding: 14px 26px; border-radius: 12px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, #6a1fd6, var(--violet)); border: 2px solid var(--gold); }
    .pause-actions #btn-menu { background: transparent; }
    .pause-actions button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    #pause small { display: block; margin-top: 14px; font: 600 14px Inter, sans-serif; color: var(--text); letter-spacing: .05em; }
    #nowplaying { position: fixed; left: 16px; bottom: 12px; font: 600 12px Orbitron, sans-serif; color: var(--gold); opacity: 0;
      transition: opacity .6s; pointer-events: none; letter-spacing: .1em; }
    #nowplaying.on { opacity: .9; }
    #stats .mission { color: #ffcf5a; }
    #stats .clock { color: #fff; letter-spacing: .12em; }
    .meter.body .bar i { background: linear-gradient(90deg, #6a1fd6, var(--gold)); }
    #prompt { position: fixed; bottom: 16%; left: 50%; transform: translateX(-50%); font: 900 16px Orbitron, sans-serif; letter-spacing: .08em;
      color: var(--gold); background: rgba(10, 4, 24, .7); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 10px; pointer-events: none; }
    @media not all and (pointer: coarse) { #prompt.ground { left: 16px; bottom: 44px; transform: none; font-size: 13px; max-width: 44%; } }
    /* THE GOLD ARROW (09-25: "more visible, its hard to follow"): bigger, outlined black so it reads on a bright sky,
       pulsing, and it NAMES its target; off screen a big chevron orbits the reticle pointing the way. The outline is a
       black shape UNDER the gold one — NOT a CSS drop-shadow filter: three stacked filters on a moving element cost
       15-18 fps on the integrated GPU (A/B: 19.5/31.3 fps with, 37.3/48.5 without). */
    #waypoint, #guide { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 4; }
    #waypoint .pin { position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; animation: wppulse 1.1s ease-in-out infinite; }
    #guide .chev { position: absolute; left: -26px; top: -20px; width: 52px; height: 40px; animation: wppulse 0.9s ease-in-out infinite; }
    #waypoint .pin::before, #waypoint .pin::after, #guide .chev::before, #guide .chev::after { content: ""; position: absolute; }
    #waypoint .pin::before, #guide .chev::before { inset: 0; background: #120a02; } /* the black outline */
    #waypoint .pin::after, #guide .chev::after { inset: 5px; background: #ffcf5a; }
    #waypoint .pin::before, #waypoint .pin::after { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
    #waypoint.edge .pin { animation: none; }
    #waypoint.edge .pin::before, #waypoint.edge .pin::after, #guide .chev::before, #guide .chev::after { clip-path: polygon(0 0, 100% 50%, 0 100%, 30% 50%); }
    #waypoint .tag, #guide .tag { position: absolute; top: 26px; left: 0; transform: translateX(-50%); white-space: nowrap;
      font: 800 13px Orbitron, sans-serif; letter-spacing: .08em; color: #ffe39a; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000; }
    #waypoint.edge .tag { display: none; }
    #guide .tag { top: 30px; }
    @keyframes wppulse { 50% { transform: scale(1.18); } }
    .meter.stealth span { color: #9fe8ff; text-shadow: 0 0 12px #9fe8ff; }
    .meter.stealth .bar i { background: linear-gradient(90deg, #9fe8ff, #ffffff); }
    /* BOSS BAR (audit pick #2): a real health bar top-centre; the white "chip" trails the damage */
    #bossbar { position: fixed; bottom: 64px; left: 50%; /* bottom-centre: the top-left stats wrap onto several lines */ transform: translateX(-50%); width: min(620px, calc(100% - 32px)); pointer-events: none; z-index: 3; text-align: center; }
    #bossbar b { display: block; font: 900 clamp(13px, 1.8vw, 17px) Orbitron, sans-serif; letter-spacing: .22em; color: #ffcf5a; text-shadow: 0 0 10px #000, 0 0 16px rgba(255, 60, 60, .5); margin-bottom: 5px; }
    #bossbar .track { position: relative; height: 14px; border: 2px solid var(--gold); border-radius: 8px; background: rgba(10, 4, 24, .8); overflow: hidden; box-shadow: 0 0 16px rgba(212, 167, 58, .4); }
    #bossbar .chip, #bossbar .hp { position: absolute; left: 0; top: 0; bottom: 0; right: 0; transform-origin: left; }
    #bossbar .chip { background: #fff; transition: transform .6s ease-out .25s; }
    #bossbar .hp { background: linear-gradient(90deg, #7dff3a, #d4a73a); transition: transform .12s linear; }
    #bossbar.enraged .hp { background: linear-gradient(90deg, #ff2f4f, #ff8a2a); animation: rage .5s ease-in-out infinite alternate; }
    #bossbar.enraged b::after { content: " · ENRAGED"; color: #ff4d6d; }
    @keyframes rage { from { filter: brightness(1); } to { filter: brightness(1.6); } }
    /* BOSS ENTRANCE: letterbox bars + a big name card */
    #bosscard { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: grid; place-items: center; }
    #bosscard::before, #bosscard::after { content: ""; position: absolute; left: 0; right: 0; height: 11vh; background: #000; animation: bars .35s ease-out both; }
    #bosscard::before { top: 0; }
    #bosscard::after { bottom: 0; }
    @keyframes bars { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    #bosscard div { text-align: center; animation: slam .5s cubic-bezier(.2, 1.4, .4, 1) both .2s; }
    #bosscard h2 { margin: 0; font: 900 clamp(28px, 6.5vw, 76px) Orbitron, sans-serif; letter-spacing: .12em; color: #ffcf5a; text-shadow: 0 0 24px rgba(255, 60, 60, .8), 0 4px 0 #000; }
    #bosscard p { margin: 6px 0 0; font: 700 clamp(11px, 1.6vw, 16px) Orbitron, sans-serif; letter-spacing: .3em; color: #ffb3c0; text-shadow: 0 2px 6px #000; }
    @keyframes slam { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: scale(1); } }
    #flash.rage { background: radial-gradient(transparent 35%, rgba(255, 30, 50, .6)); }
    /* +SCORE popups where the enemy died */
    #popups { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
    .popup { position: absolute; left: 0; top: 0; font: 900 16px Orbitron, sans-serif; color: #ffcf5a; text-shadow: 0 0 8px #000, 0 0 12px rgba(155, 77, 255, .8);
      animation: pop .9s ease-out forwards; white-space: nowrap; }
    .popup.big { font-size: 34px; color: #fff3c4; animation-duration: 1.8s; }
    @keyframes pop { 0% { opacity: 0; translate: -50% 0; scale: .6; } 15% { opacity: 1; scale: 1.15; } 100% { opacity: 0; translate: -50% -60px; scale: 1; } }
    #stats .bb { color: #c58bff; }
    #stats .bb.cool { opacity: .5; }
    #tutor .tutor-skip { pointer-events: auto; display: inline-block; margin-top: 4px; padding: 3px 10px; font: 800 10px Orbitron, sans-serif; letter-spacing: .12em;
      color: var(--gold); background: rgba(10, 4, 24, .8); border: 1px solid var(--gold); border-radius: 8px; cursor: pointer; }
    /* PHONES (owner 09-24 screenshots): the stats ran under the top buttons, the tutorial sat on the stick and had no
       way out, and the stick was invisible until touched. Compact HUD, visible resting stick, tutorial between the
       stick and the buttons, prompts above it. */
    @media (pointer: coarse) {
      #hud { top: 6px; left: 10px; right: 312px; } /* a little air before the top buttons */
      #level-title { font-size: 10px; }
      #stats { font-size: 11px; gap: 2px 10px; margin-top: 2px; }
      .meter { font-size: 9px; gap: 6px; }
      .meter .bar { width: 110px; height: 7px; }
      #controls { top: 6px; right: 8px; gap: 5px; }
      #controls button { padding: 6px 8px; font-size: 10px; }
      #stick .ring { display: block; opacity: .5; transition: opacity .15s; }
      #stick .ring.live { opacity: 1; }
      #stick span { left: 30px; bottom: 6px; font-size: 9px; }
      #tutor { top: auto; bottom: 44px; left: 50%; transform: translateX(-50%); width: min(430px, calc(100% - 420px)); max-width: none; padding: 5px 12px; } /* fixed width so long steps WRAP */
      #tutor span { font-size: 11px; }
      #prompt { bottom: 112px; font-size: 12px; padding: 6px 12px; }
      #bossbar { bottom: 8px; width: min(420px, calc(100% - 440px)); }
      #toast { top: 30%; }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #hud { top: 46px; right: 10px; } /* the three top buttons span the width: stats go under them */
      #tutor { bottom: 318px; left: 16px; right: 16px; width: auto; transform: none; max-width: none; } /* above the stick + buttons; wraps */
      #prompt { bottom: 390px; max-width: calc(100% - 32px); }
      #bossbar { bottom: 300px; width: calc(100% - 32px); }
    }
    /* FREE OAKLAND (09-25): the city map, district lines, the gold "district is free" slam, a shielded relay bar */
    @media not all and (pointer: coarse) { #hud { right: 250px; } } /* desktop: the stats wrap before the minimap (phones keep their own layout) */
    #minimap { position: fixed; top: 58px; right: 12px; width: 220px; height: 158px; border: 1px solid rgba(212, 167, 58, .7); border-radius: 10px;
      background: #12101a; box-shadow: 0 0 16px rgba(0, 0, 0, .6); pointer-events: none; z-index: 3; image-rendering: auto; }
    #stats .free { color: #ffcf5a; letter-spacing: .06em; }
    /* PALANTÍR HUNTERS: alert marks over scouts. "?" fills gold as it gets suspicious; "!" pulses red with the backup countdown */
    #detect { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    #detect .mark { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center;
      font: 900 18px Orbitron, sans-serif; color: #1a1204; background: conic-gradient(#ffd24a calc(var(--k) * 360deg), rgba(20, 14, 30, .75) 0);
      border: 2px solid #ffd24a; box-shadow: 0 0 10px rgba(255, 210, 74, .7); }
    #detect .mark.alarm { width: auto; min-width: 40px; padding: 0 8px; border-radius: 16px; background: #ff3040; color: #fff; border-color: #ffd0d4;
      box-shadow: 0 0 16px #ff3040; animation: lockblink .3s steps(2) infinite; }
    #stats .lotus { color: #ffe39a; text-shadow: 0 0 10px #b46bff, 0 0 4px #ffcf5a; animation: lockblink .5s steps(2) infinite; }
    #stats .zone { color: #ff8a9a; }
    #stats .zone.free, #stats .zone.home { color: #ffe39a; }
    #bosscard.freed::before, #bosscard.freed::after { background: linear-gradient(90deg, #1a1004, #3a2a08, #1a1004); }
    #bosscard.freed h2 { color: #fff3c4; text-shadow: 0 0 26px rgba(255, 190, 60, .95), 0 4px 0 #000; }
    #bosscard.freed p { color: #ffe39a; }
    #bossbar.shielded .hp { background: repeating-linear-gradient(45deg, #ff6a8a 0 10px, #b02a4a 10px 20px); }
    #bossbar.shielded b::after { content: " · SHIELDED"; color: #ff8a9a; }
    @media (pointer: coarse) { #minimap { top: 40px; right: 200px; width: 120px; height: 86px; } } /* phones: left of the 178px button column, not under it */
    @media (pointer: coarse) and (orientation: portrait) { #minimap { top: 232px; bottom: auto; right: 8px; width: 110px; height: 79px; } } /* the open sky under the HUD: the button grid now reaches 344px up */
    /* THE GARAGE (09-25): Rob & Mahal build permanent upgrades with the credits every run banks */
    #card.garage { width: min(900px, calc(100% - 24px)); text-align: left; }
    #card.garage h2 { text-align: center; }
    #card.garage .garage-sub { text-align: center; font: 900 18px Orbitron, sans-serif; color: #ffcf5a; letter-spacing: .1em; margin: 0; }
    #card.garage .garage-said { text-align: center; font-style: italic; color: #e9dcff; min-height: 1.6em; }
    #card.garage .garage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 8px; }
    #card.garage .tile { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 12px; background: rgba(155, 77, 255, .12); border: 1px solid rgba(212, 167, 58, .5); }
    #card.garage .tile.maxed { border-color: #ffcf5a; background: rgba(212, 167, 58, .14); }
    #card.garage .tile b { font: 900 13px Orbitron, sans-serif; color: #ffcf5a; letter-spacing: .06em; }
    #card.garage .tile .pips { color: #c58bff; letter-spacing: .15em; }
    #card.garage .tile small { font-size: 12px; opacity: .85; }
    #card.garage .tile small.next { color: #bff6ff; }
    #card.garage .tile .buy { margin-top: 6px; padding: 8px 10px; font-size: 12px; }
    #card.garage .tile .buy:disabled { opacity: .4; cursor: not-allowed; }
    #card.garage > button:last-child { display: block; margin: 16px auto 0; }
    /* RING RACES (09-25): the race clock top-centre; 3-2-1 slams big */
    /* LEADERBOARD + CLIPS (09-25) */
    #card .lb-wrap { margin: 10px auto 4px; max-width: 420px; text-align: left; }
    #card .lb-head { font: 900 12px Orbitron, sans-serif; letter-spacing: .08em; color: #ffcf5a; text-align: center; margin-bottom: 6px; }
    #card .lb-name { display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 12px Orbitron, sans-serif; letter-spacing: .06em; margin-bottom: 6px; }
    #card .lb-name input { width: 4.2em; padding: 4px 6px; font: 900 18px Orbitron, sans-serif; letter-spacing: .18em; text-align: center; text-transform: uppercase;
      color: #fff3c4; background: rgba(155, 77, 255, .18); border: 1px solid var(--gold); border-radius: 8px; }
    .lb { list-style: none; margin: 0; padding: 0; counter-reset: lb; }
    .lb li { counter-increment: lb; display: grid; grid-template-columns: 2em 3.6em 1fr auto; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 6px; font-size: 13px; }
    .lb li::before { content: counter(lb) "."; opacity: .6; }
    .lb li b { font: 900 13px Orbitron, sans-serif; letter-spacing: .12em; color: #fff3c4; }
    .lb li small { opacity: .6; font-size: 11px; }
    .lb li.me { background: rgba(212, 167, 58, .22); outline: 1px solid rgba(255, 207, 90, .7); }
    .lb li.empty { grid-template-columns: 1fr; opacity: .6; }
    .lb li.empty::before { content: none; }
    #card.garage .tile .lb li { padding: 1px 4px; font-size: 11px; grid-template-columns: 1.6em 3.2em 1fr; }
    #card.garage .tile .lb li small { display: none; }
    #card .clip-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 2px; }
    #card .clip-row .clip-note { width: 100%; font: 700 11px Orbitron, sans-serif; letter-spacing: .06em; color: #bff6ff; }
    #card .clip-row button { margin: 0; padding: 8px 14px; font-size: 12px; }
    #rec { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 3px 10px 3px 8px; border-radius: 999px; pointer-events: none;
      font: 900 12px Orbitron, sans-serif; letter-spacing: .1em; color: #fff; background: rgba(20, 0, 8, .7); border: 1px solid rgba(255, 60, 80, .8); }
    #rec::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #ff3a4f; animation: recblink 1s steps(2) infinite; }
    @keyframes recblink { 50% { opacity: 0; } }
    #racehud { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); font: 900 22px Orbitron, sans-serif; letter-spacing: .08em; color: #fff3c4;
      background: rgba(10, 4, 24, .72); border: 2px solid var(--gold); border-radius: 14px; padding: 6px 18px; pointer-events: none; z-index: 3; white-space: nowrap; text-shadow: 0 0 10px rgba(255, 190, 60, .6); }
    #racehud.count { top: 30%; font-size: clamp(60px, 14vw, 140px); border: none; background: none; text-shadow: 0 0 30px rgba(255, 190, 60, .9), 0 6px 0 #000; }
    @media (pointer: coarse) { #racehud { top: 42px; font-size: 14px; } }
    /* TECH SUPPORT COMMS (09-25): Rob <-> Mahal over each other's shoulder. Left edge, below the stats. */
    #comms { position: fixed; left: 16px; top: 46%; max-width: min(360px, 40vw); padding: 8px 12px 9px; border-radius: 10px; pointer-events: none; z-index: 3;
      background: rgba(8, 6, 18, .82); border-left: 4px solid #ffcf5a; box-shadow: 0 0 18px rgba(0, 0, 0, .5); opacity: 0; transform: translateX(-12px); transition: opacity .25s, transform .25s; }
    #comms.on { opacity: 1; transform: none; }
    #comms[data-who="mahal"] { border-left-color: #b56cff; }
    #comms[data-who="rob"] { border-left-color: #2ee6a8; }
    #comms b { display: block; font: 800 10px Orbitron, sans-serif; letter-spacing: .16em; color: #ffe39a; margin-bottom: 3px; }
    #comms[data-who="mahal"] b { color: #d9b8ff; }
    #comms[data-who="rob"] b { color: #8ff5d0; }
    #comms[data-who="qm85"] { border-left-color: #ffcf5a; }
    #comms[data-who="qm85"] b { color: #ffe39a; }
    /* a threat call (a pack closing in, one on your six, a beam, low shield): red edge + a pulse */
    #comms.alert { border-left-color: #ff4a4a; box-shadow: 0 0 0 1px rgba(255, 74, 74, .55), 0 0 22px rgba(255, 40, 40, .35); animation: commsalert 0.6s ease-in-out 3; }
    #comms.alert b { color: #ff9a9a; }
    @keyframes commsalert { 50% { box-shadow: 0 0 0 2px rgba(255, 74, 74, .9), 0 0 34px rgba(255, 40, 40, .6); } }
    #comms span { font: 600 14px Inter, sans-serif; color: #f4ecff; line-height: 1.35; }
    @media (pointer: coarse) { #comms { top: auto; bottom: 200px; left: 10px; max-width: 46vw; } #comms span { font-size: 12px; } }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { #toast, #subtitle { transition: none; } .popup, #bosscard div { animation-duration: .01s; } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud" hidden><div id="level-title"></div><div id="stats"></div></div>
  <div id="reticle" hidden></div>
  <div id="lock" hidden><div class="ring"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div><i class="dot"></i><div class="hpbar"><i></i></div><b class="tag"></b></div>
  <div id="pointer" hidden></div>
  <div id="flash"></div>
  <div id="popups"></div>
  <div id="bossbar" hidden><b></b><div class="track"><i class="chip"></i><i class="hp"></i></div></div>
  <div id="bosscard" hidden><div><h2></h2><p></p></div></div>
  <div id="detect" aria-hidden="true"></div>
  <div id="racehud" hidden role="timer"></div>
  <div id="rec" hidden aria-live="polite"></div>
  <div id="comms" aria-live="polite"><b></b><span></span></div>
  <canvas id="minimap" width="440" height="316" hidden aria-label="Oakland map: red = occupied, gold = free"></canvas>
  <div id="prompt" hidden></div>
  <div id="waypoint" hidden><i class="pin"></i><b class="tag"></b></div>
  <div id="guide" hidden><i class="chev"></i><b class="tag"></b></div>
  <div id="credit" hidden></div>
  <div id="controls">
    <button id="btn-pause" type="button" title="Pause (P / Esc)">II PAUSE</button>
    <button id="btn-mute" type="button" title="Mute everything (M)">SOUND ON</button>
    <button id="btn-vol" type="button" title="Music volume (N)">MUSIC</button>
  </div>
  <div id="pause" hidden>PAUSED<small>P / ESC to resume · M mute · N music volume</small>
    <div class="pause-actions">
      <button id="btn-resume" type="button">▶ RESUME</button>
      <button id="btn-menu" type="button">⌂ MAIN MENU</button>
    </div>
  </div>
  <div id="nowplaying"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="subtitle" aria-live="polite"></div>
  <div id="loading">BOOTING QM85...</div>
  <div id="card" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
